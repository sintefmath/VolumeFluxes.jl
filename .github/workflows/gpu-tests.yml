name: GPU tests (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'sintefmath/VolumeFluxes.jl' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, cuda]
    timeout-minutes: 90
    env:
      VOLUMEFLUXES_BACKEND: gpu
      VOLUMEFLUXES_TEST_PLOTS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate and build dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Require CUDA and run CPU and GPU suite
        run: |
          julia --project -e 'using CUDA, VolumeFluxes; CUDA.versioninfo(); VolumeFluxes.has_cuda_backend() || error("Functional CUDA is required")'
          julia --project -e 'using Pkg; Pkg.test()'
