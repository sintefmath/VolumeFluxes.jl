name: Documentation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      VOLUMEFLUXES_BACKEND: cpu
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1.10'
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate and build dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Build documentation without executing examples
        run: |
          julia --project docs/make.jl
          test -s docs/build/index.html
          test -f docs/build/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        if: github.repository == 'sintefmath/VolumeFluxes.jl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: docs/build

  deploy:
    if: github.repository == 'sintefmath/VolumeFluxes.jl' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
