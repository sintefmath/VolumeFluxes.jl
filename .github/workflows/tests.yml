name: CPU tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cpu-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        julia: ['1.10', '1']
    env:
      VOLUMEFLUXES_BACKEND: cpu
      VOLUMEFLUXES_TEST_PLOTS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.julia }}
      - uses: julia-actions/cache@v3
        with:
          delete-old-caches: 'false'
      - name: Instantiate and build dependencies
        run: julia --project -e 'using Pkg; Pkg.instantiate(); Pkg.build()'
      - name: Run CPU suite
        run: julia --project -e 'using Pkg; Pkg.test()'
